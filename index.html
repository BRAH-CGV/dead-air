<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Air</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }

      /* ── Crosshair ─────────────────────────────────────── */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
        display: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 1px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        transition: background 0.15s, transform 0.15s;
      }
      /* vertical bar */
      #crosshair::before {
        width: 2px;
        height: 14px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* horizontal bar */
      #crosshair::after {
        width: 14px;
        height: 2px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* Active state: brighter + slightly larger when targeting an interactable */
      #crosshair.active::before,
      #crosshair.active::after {
        background: #00e5ff;
        box-shadow: 0 0 4px #00e5ff;
      }
      #crosshair.active::before { height: 18px; }
      #crosshair.active::after  { width:  18px; }
      /* Inlined so the panel paints before any script has parsed. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0d0d14;
        color: #b8b8c8;
        font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      #loading.is-hidden { opacity: 0; pointer-events: none; }
      #loading-track {
        width: min(320px, 60vw);
        height: 2px;
        background: #23232e;
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #6ecf9a;
        transition: width 0.2s ease;
      }
      #loading.is-error #loading-bar { background: #cf6e6e; }
      #loading.is-error #loading-label {
        color: #cf8a8a;
        max-width: 60vw;
        text-align: center;
        text-transform: none;
        letter-spacing: 0;
      }

      /* ── HUD ────────────────────────────────────────────── */
      #hud {
        position: fixed;
        top: 16px;
        right: 20px;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        pointer-events: none;
        z-index: 90;
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }
      #hud-clock {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 0.06em;
        color: #d8e8f0;
      }
      #hud-signals {
        color: #6ecf9a;
        letter-spacing: 0.04em;
      }
      #hud-night {
        color: #8898a8;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #hud-scan-bar {
        display: none;
        width: 160px;
        height: 4px;
        background: #00e5ff;
        border-radius: 2px;
        margin-top: 6px;
        transition: width 0.15s ease;
      }
      #hud-prompt {
        margin-top: 8px;
        font-size: 13px;
        color: #b8c8d8;
      }
      #hud-suit {
        display: none;
        margin-top: 6px;
        font-size: 11px;
        color: #e8a050;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      #hud-stamina {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        font-size: 11px;
        color: #8898a8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #hud-stamina-track {
        width: 120px;
        height: 5px;
        background: rgba(255,255,255,0.08);
        border-radius: 3px;
        overflow: hidden;
      }
      #hud-stamina-fill {
        width: 100%;
        height: 100%;
        background: #6ecf9a;
        transition: background 0.4s ease;
      }
      #hud-stamina[data-level="tired"] #hud-stamina-fill    { background: #e8a050; }
      #hud-stamina[data-level="critical"] #hud-stamina-fill { background: #e0503c; }

      /* ── Event banner (EventBanner.js) ──────────────────
         Centred in the upper third, large readable text with a subtle
         dark backing. Fade in, hold, fade out: the opacity transitions as
         EventBanner puts .is-shown on and takes it off. */
      #event-banner {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 92;
        /* Above the fatigue tunnel (80), under the eyelids (100). */
        max-width: min(720px, 80vw);
        padding: 12px 28px;
        background: rgba(8, 10, 18, 0.72);
        border-radius: 4px;
        font: 24px/1.3 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        color: #d8e8f0;
        text-align: center;
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0s linear 0.3s;
      }
      #event-banner.is-shown { opacity: 1; visibility: visible; transition: opacity 0.3s ease; }
      #event-banner[data-tone="warning"] { color: #e8a050; }
      #event-banner[data-tone="danger"]  { color: #e0503c; }

      /* ── Eyelids (FatigueOverlay.js) ──────────────────────
         The bed animation closes them (BedRest.js), and so does fatigue.
         The tunnel sits under the HUD so the stamina bar stays readable;
         the lids close over the HUD and the panels, but under the
         white-out, the menus and the screen fade. */
      #fatigue-tunnel {
        position: fixed;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        z-index: 80;
        background: radial-gradient(ellipse at center,
          transparent 24%, rgba(0,0,0,0.55) 50%, #000 80%);
      }
      #fatigue-lids {
        --lid: 0;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      /* Night 0's big words and arrow (TutorialOverlay.js): over the
         radar, so the strip it shrinks to at the computer still reads;
         under the lids, the fades and the menus. */
      #tutorial {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 98;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #ffd27a;
        text-shadow: 0 2px 6px #000, 0 0 2px #000;
      }
      #tutorial .tutorial-card {
        position: absolute;
        left: 50%;
        top: 14%;
        transform: translateX(-50%);
        width: min(90vw, 900px);
        text-align: center;
      }
      #tutorial .tutorial-title {
        font-size: clamp(28px, 5vw, 56px);
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      #tutorial .tutorial-text {
        margin-top: 0.6em;
        font-size: clamp(14px, 1.8vw, 20px);
        letter-spacing: 0.04em;
        color: #e8dcc0;
      }
      #tutorial.compact .tutorial-card { top: 10px; }
      #tutorial.compact .tutorial-title { font-size: 20px; }
      #tutorial.compact .tutorial-text { font-size: 13px; margin-top: 0.3em; }
      /* Centred on the point TutorialOverlay translates it to, then turned. */
      #tutorial .tutorial-arrow {
        position: absolute;
        left: -32px;
        top: -20px;
        width: 64px;
        height: 40px;
      }
      #tutorial .tutorial-arrow svg { display: block; overflow: visible; }
      #tutorial .tutorial-arrow path {
        fill: #ffd27a;
        stroke: #000;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      /* Nudges along the way it points. */
      #tutorial .tutorial-arrow-bob { animation: tutorial-bob 0.8s ease-in-out infinite alternate; }
      @keyframes tutorial-bob {
        from { transform: translateX(-10px); }
        to   { transform: translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tutorial .tutorial-arrow-bob { animation: none; }
      }
      /* A nap's way out ("[E] Wake up", Nap.js): over the closed lids,
         which cover the HUD; under the white-out and the screen fade. */
      #nap-hint {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 101;
        font: 13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        color: #8898a8;
        text-shadow: 0 1px 3px #000;
      }
      #fatigue-lids::before,
      #fatigue-lids::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 52%;
        background: #000;
      }
      #fatigue-lids::before { top: 0;    transform: translateY(calc((var(--lid) - 1) * 100%)); }
      #fatigue-lids::after  { bottom: 0; transform: translateY(calc((1 - var(--lid)) * 100%)); }

      /* The bed's closed-eyes view (BedRest.js, FatigueOverlay.js): the
         world darkens and desaturates behind a heavy vignette, the bedside
         clock's red digits still readable. backdrop-filter is removed when
         the strength is 0 so it costs nothing outside of bed. */
      #bed-darkness {
        --dark: 0;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 99;
        opacity: 0;
        background: radial-gradient(ellipse at center,
          transparent 15%, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.92) 75%);
        mix-blend-mode: multiply;
      }

      /* ── Radar overlay ─────────────────────────────────── */
      #radar-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(8, 10, 18, 0.82);
        z-index: 95;
        font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
      }
      #radar-canvas {
        border-radius: 50%;
        box-shadow: 0 0 30px rgba(0, 200, 180, 0.15);
      }
      #radar-warning {
        min-height: 1.4em;
        max-width: 640px;
        text-align: center;
        color: #ff4d5e;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        visibility: hidden;
      }
      #radar-warning.is-shown {
        visibility: visible;
        animation: radar-warning-flash 0.6s steps(2, jump-none) infinite;
      }
      @keyframes radar-warning-flash {
        from { opacity: 1; }
        to   { opacity: 0.25; }
      }
      #radar-info {
        min-height: 1.4em;
        text-align: center;
        color: #00dcc8;
      }
      #radar-hint {
        font-size: 11px;
        color: #556;
        letter-spacing: 0.06em;
      }

      /* ── Radar telemetry (left-side readouts) ─────────── */
      #radar-telemetry {
        position: absolute;
        left: 24px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 10px 12px;
        border: 1px solid rgba(0, 200, 180, 0.3);
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
      }
      .telemetry-block {
        border-left: 2px solid rgba(0, 200, 180, 0.25);
        padding: 6px 10px 6px 12px;
        min-width: 200px;
      }
      .telemetry-block-title {
        font-size: 10px;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #00dcc8;
        margin-bottom: 4px;
        opacity: 0.7;
      }
      .telemetry-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        line-height: 1.6;
      }
      .telemetry-label {
        color: #556;
        letter-spacing: 0.08em;
      }
      .telemetry-value {
        color: #b8c8d8;
        font-variant-numeric: tabular-nums;
        min-width: 5em;
        text-align: right;
      }

      /* ── On a screen (#161) ───────────────────────────────
         The radar, the processing console and the camera's overlay are
         what their screens in the world show: laid out here, for good, at
         a fixed size (BaseScene._hostOnScreen), and painted onto the
         screen from this layout (paintDom), leaned in to or not. So they
         are never seen on the page: always displayed (the layout is what
         is painted), never visible. Leaned in, ScreenView lays one onto
         its screen with a matrix3d and .is-focused lets it take the mouse,
         so clicks, hovers and drags land where they are painted. */
      #radar-overlay.on-screen,
      #processing-screen.on-screen,
      #cctv.on-screen,
      #bedroom-pc.on-screen {
        inset: auto;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        box-sizing: border-box;
        overflow: hidden;
        opacity: 0 !important;
        pointer-events: none;
      }
      #radar-overlay.on-screen,
      #processing-screen.on-screen,
      #bedroom-pc.on-screen { display: flex !important; }
      #cctv.on-screen { display: block !important; background: none; }
      #radar-overlay.on-screen.is-focused,
      #processing-screen.on-screen.is-focused,
      #cctv.on-screen.is-focused { pointer-events: auto; }
      /* Leaned in to a screen (ScreenView): nothing to aim at or [E]. */
      body.screen-on :is(#crosshair, #prompt) { visibility: hidden !important; }
      /* The screen's own colour, painted edge to edge. The camera's overlay
         has none: it goes over the feed. */
      #radar-overlay.on-screen { background: #05080d; }
      #processing-screen.on-screen { background: #04060b; }
      #bedroom-pc.on-screen { background: #07130c; z-index: auto; }
      /* The PC's panel fills its monitor, sized to be read on it. */
      #bedroom-pc.on-screen .pc-screen {
        width: 100%;
        height: 100%;
        max-height: none;
        padding: 30px 40px 24px;
        gap: 18px;
        border: 0;
        border-radius: 0;
        font-size: 24px;
      }
      #bedroom-pc.on-screen .pc-body { min-height: 0; flex: 1; }
      #bedroom-pc.on-screen .pc-map { width: min(470px, 100%); }
      #bedroom-pc.on-screen :is(.pc-note, .pc-hint) { font-size: 18px; }

      /* ── Processing screen (ServerRoom console) ────────── */
      #processing-screen {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        background: rgba(6, 8, 14, 0.92);
        z-index: 96;
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
      }
      #processing-title {
        color: #00dcc8;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 14px;
      }
      #processing-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 484px;
        height: 364px;
        border: 2px solid rgba(0, 200, 180, 0.15);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }
      #tuning-game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 484px;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #tuning-game.disabled {
        opacity: 0.3;
        pointer-events: none;
      }
      #tuning-canvas {
        width: 480px;
        height: 60px;
        border: 2px solid rgba(0, 200, 180, 0.15);
        border-radius: 4px;
        background: rgba(6, 8, 14, 0.6);
      }
      #tuning-slider {
        width: 480px;
        accent-color: #00c8b4;
        cursor: pointer;
      }
      #processing-spectrogram {
        width: 480px;
        height: 360px;
        image-rendering: pixelated;
      }
      #processing-scanline {
        position: absolute;
        top: 0;
        left: 0;
        width: 2px;
        height: 100%;
        background: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        display: none;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
      }
      #processing-viz {
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        margin: 6px 0;
        opacity: 1;
        transition: opacity 0.3s ease;
      }
      #processing-viz.disabled {
        opacity: 0.3;
        pointer-events: none;
      }
      .viz-slider {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .viz-slider label {
        color: #556;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        min-width: 48px;
      }
      .viz-slider input[type="range"] {
        width: 80px;
        accent-color: #00c8b4;
      }
      #processing-media {
        display: flex;
        gap: 8px;
        justify-content: center;
        min-height: 32px;
        margin-bottom: 4px;
      }
      .media-btn {
        appearance: none;
        padding: 4px 14px;
        border: 1px solid rgba(0, 200, 180, 0.4);
        border-radius: 2px;
        background: rgba(0, 200, 180, 0.06);
        color: #b8c8d8;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .media-btn:hover:not(:disabled) {
        background: rgba(0, 200, 180, 0.15);
        border-color: rgba(0, 200, 180, 0.7);
        color: #d8f0e8;
      }
      .media-btn:disabled {
        opacity: 0.3;
        cursor: default;
        border-color: rgba(128, 128, 128, 0.25);
      }
      #processing-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        min-height: 36px;
      }
      .processing-btn {
        appearance: none;
        padding: 6px 18px;
        border: 1px solid rgba(0, 200, 180, 0.5);
        border-radius: 2px;
        background: rgba(0, 200, 180, 0.08);
        color: #b8c8d8;
        font: inherit;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .processing-btn:hover:not(:disabled) {
        background: rgba(0, 200, 180, 0.18);
        border-color: rgba(0, 200, 180, 0.8);
        color: #d8f0e8;
      }
      .processing-btn:disabled {
        opacity: 0.35;
        cursor: default;
        border-color: rgba(128, 128, 128, 0.3);
      }
      #processing-hint {
        color: #556;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 11px;
      }
      #processing-progress {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin: 6px 0;
      }
      #processing-progress-bar {
        width: 200px;
        height: 6px;
        background: rgba(0, 200, 180, 0.1);
        border: 1px solid rgba(0, 200, 180, 0.25);
        border-radius: 3px;
        overflow: hidden;
      }
      #processing-progress-fill {
        height: 100%;
        width: 0%;
        background: rgba(0, 200, 180, 0.6);
        transition: width 0.25s linear;
      }
      #processing-progress-label {
        color: #889;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      /* ── Menus (MenuView.js draws into #menu-panel) ─────────
         Voices-of-the-Void plain: text rows, hairlines, monospace, no
         gradients, no rounded pills, no blur. Every animation is CSS-only
         and switched off under prefers-reduced-motion. */
      #menu {
        --menu-bg:      rgba(13, 13, 20, 0.88);
        --menu-dim:     rgba(0, 0, 0, 0.55);
        --menu-text:    #b8b8c8;
        --menu-bright:  #d8e8f0;
        --menu-muted:   #8898a8;
        --menu-line:    rgba(184, 184, 200, 0.18);
        --menu-ok:      #6ecf9a;
        --menu-danger:  #cf6e6e;
        --menu-warn:    #e8a050;
        --menu-accent:  #00dcc8;
        --menu-font:    ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        z-index: 150;
        pointer-events: auto;   /* covers the canvas: only menu buttons request the lock */
        background: var(--menu-dim);
        color: var(--menu-text);
        font: 14px/1.5 var(--menu-font);
      }
      #menu.is-open { display: flex; }
      /* The main menu sits over the living base at night: a lighter dim. */
      #menu[data-screen="main"] { background: rgba(0, 0, 0, 0.28); }
      /* Faint scanlines over everything: one static texture, no JS. */
      #menu::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 3px);
      }
      #menu-status {
        position: absolute;
        top: 16px;
        right: 20px;
        text-align: right;
        font-size: 12px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        color: var(--menu-muted);
      }
      #menu-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        margin-left: max(16px, 8vw);
        padding: 28px 32px;
        border: 1px solid var(--menu-line);
        background: var(--menu-bg);
      }
      #menu[data-screen="main"] #menu-panel { border-color: transparent; background: rgba(13, 13, 20, 0.6); }
      #menu[data-screen="settings"] #menu-panel,
      #menu[data-screen="credits"] #menu-panel,
      #menu[data-screen="runComplete"] #menu-panel { width: min(760px, calc(100vw - 32px)); }
      @media (max-width: 640px) {
        #menu-panel { margin: 0 16px; padding: 20px 16px; }
      }

      .menu-title {
        margin: 0;
        font-size: clamp(36px, 7vw, 76px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.32em;
        color: var(--menu-bright);
        animation: menu-flicker 7s infinite;
      }
      .menu-cursor {
        display: inline-block;
        width: 0.5em;
        height: 0.8em;
        margin-left: 0.05em;
        background: var(--menu-text);
        animation: menu-blink 1.1s steps(1) infinite;
      }
      .menu-tagline { --ls: 0.14em; color: var(--menu-ok); font-size: 13px; letter-spacing: var(--ls); min-height: 4.5em; }
      .menu-type {
        /* Each character is 1ch plus the letter-spacing; 1ch alone clipped
           the end of every line. */
        width: calc(var(--chars) * (1ch + var(--ls)));
        overflow: hidden;
        white-space: nowrap;
        animation: menu-type 0.8s steps(var(--chars)) calc(0.3s + var(--i) * 0.9s) both;
      }
      .menu-heading {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--menu-bright);
      }
      .menu-heading.is-danger { color: var(--menu-danger); }
      .menu-heading.is-ok     { color: var(--menu-ok); letter-spacing: 0.08em; text-transform: none; }
      .menu-subheading {
        margin: 14px 0 4px;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.2em;
        color: var(--menu-muted);
      }
      .menu-status-line { color: var(--menu-accent); font-size: 13px; letter-spacing: 0.1em; }
      .menu-text { margin: 0; }
      .menu-hint { min-height: 1.5em; font-size: 12px; color: var(--menu-warn); }
      .menu-footer { font-size: 12px; color: var(--menu-muted); }
      /* The menu music's credit: the bottom corner of the screen, under the
         status lines in the top one. */
      .menu-music-credit {
        position: fixed;
        right: 20px;
        bottom: 16px;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--menu-muted);
      }

      .menu-list { display: flex; flex-direction: column; }
      .menu-list-inline { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
      .menu-list-inline .menu-item { width: auto; }
      .menu-item, .menu-tab, .menu-choice, .menu-bind {
        appearance: none;
        margin: 0;
        border: 1px solid transparent;
        border-radius: 0;
        background: none;
        color: var(--menu-text);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .menu-item {
        position: relative;
        width: 100%;
        padding: 5px 10px 5px 24px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .menu-item::before {
        content: '>';
        position: absolute;
        left: 8px;
        opacity: 0;
      }
      /* Focus only, not :hover — MenuView moves the focus to whatever the
         mouse points at, so there is only ever one highlighted option (#75). */
      .menu-item:focus,
      .menu-tab:focus,
      .menu-choice:focus,
      .menu-bind:focus {
        outline: none;
        color: var(--menu-bright);
        background: rgba(184, 184, 200, 0.07);
      }
      .menu-slider input:focus { outline: 1px solid var(--menu-accent); outline-offset: 2px; }
      .menu-item:focus::before { opacity: 1; }
      .menu-item.is-danger:focus { color: var(--menu-danger); }
      .menu-item:disabled, .menu-choice:disabled { color: var(--menu-muted); cursor: default; background: none; }
      .menu-item:disabled::before { opacity: 0; }

      .menu-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; }
      .menu-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--menu-line); }
      .menu-tab { padding: 6px 12px; letter-spacing: 0.14em; border-bottom: 1px solid transparent; margin-bottom: -1px; }
      .menu-tab[aria-selected="true"] { color: var(--menu-accent); border-bottom-color: var(--menu-accent); }
      .menu-row { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 4px; }
      .menu-row-label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
      .menu-row-dots { flex: 1 1 auto; min-width: 12px; align-self: center; border-bottom: 1px dotted var(--menu-line); }
      .menu-row.is-flash { animation: menu-flash 0.9s 2; }
      .menu-key { color: var(--menu-bright); border: 1px solid var(--menu-line); padding: 0 6px; white-space: nowrap; }
      .menu-slider { display: inline-flex; align-items: center; gap: 10px; }
      .menu-slider input { width: min(180px, 30vw); accent-color: var(--menu-accent); }
      .menu-value { min-width: 6ch; text-align: right; color: var(--menu-accent); }
      .menu-choices { display: inline-flex; flex-wrap: wrap; }
      .menu-choice { padding: 1px 8px; letter-spacing: 0.08em; }
      .menu-choice[aria-pressed="true"] { color: var(--menu-accent); border-color: var(--menu-line); }
      .menu-bind { min-width: 10ch; padding: 1px 10px; border-color: var(--menu-line); color: var(--menu-bright); }
      .menu-bind.is-capturing { color: var(--menu-warn); border-color: var(--menu-warn); }

      .menu-credits .menu-group { margin-bottom: 8px; }
      .menu-credit { margin: 6px 0 10px; }
      .menu-credit-title { color: var(--menu-bright); }
      .menu-credit-text, .menu-credit-note { font-size: 12px; color: var(--menu-muted); overflow-wrap: anywhere; }
      .menu-credit-note { color: var(--menu-warn); }
      .menu-credit.is-todo .menu-credit-text { color: var(--menu-warn); }
      .menu-credits a { color: var(--menu-accent); }
      .menu-roll-window { height: min(52vh, 440px); overflow: hidden; }
      /* Starts one window-height down, ends scrolled off the top. */
      .menu-roll { padding-top: min(52vh, 440px); animation: menu-roll 90s linear 1s both; }

      /* The dev console (dev builds): a light backdrop, so a toggle shows on
         the paused scene behind it. */
      #menu[data-screen="console"] { background: rgba(0, 0, 0, 0.18); }
      #menu[data-screen="console"] #menu-panel {
        width: min(860px, calc(100vw - 32px));
        height: min(560px, calc(100vh - 48px));
        background: rgba(13, 13, 20, 0.82);
      }
      .menu-console-log { font-size: 13px; line-height: 1.45; }
      .menu-console-line { white-space: pre-wrap; overflow-wrap: anywhere; }
      .menu-console-line.is-input { color: var(--menu-muted); }
      .menu-console-line.is-error { color: var(--menu-danger); }
      .menu-console-prompt {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--menu-line);
      }
      .menu-console-prompt:focus-within { border-color: var(--menu-accent); }
      .menu-console-caret { color: var(--menu-accent); }
      .menu-console-input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: none;
        background: none;
        color: var(--menu-bright);
        font: inherit;
        caret-color: var(--menu-accent);
      }
      .menu-console-input::placeholder { color: var(--menu-muted); opacity: 0.6; }
      /* The guesses drop down under the input, over the log. */
      .menu-console-suggest {
        position: absolute;
        top: 100%;
        left: -1px;
        right: -1px;
        z-index: 1;
        max-height: 14em;
        overflow-y: auto;
        margin: 0;
        padding: 4px 0;
        list-style: none;
        border: 1px solid var(--menu-line);
        background: rgba(13, 13, 20, 0.97);
      }
      .menu-console-suggest[hidden] { display: none; }
      .menu-console-option { display: flex; gap: 16px; padding: 3px 12px; cursor: pointer; }
      .menu-console-option:hover,
      .menu-console-option[aria-selected="true"] { background: rgba(110, 207, 154, 0.12); }
      .menu-console-option[aria-selected="true"] .menu-console-usage { color: var(--menu-ok); }
      .menu-console-option.is-format { cursor: default; background: none; }
      .menu-console-usage { flex: 0 0 auto; color: var(--menu-bright); white-space: nowrap; }
      .menu-console-help { flex: 1 1 auto; min-width: 0; color: var(--menu-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      @media (max-width: 640px) {
        .menu-console-option { flex-direction: column; gap: 0; }
        .menu-console-help { white-space: normal; }
      }

      @keyframes menu-blink   { 50% { opacity: 0; } }
      @keyframes menu-flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.82; } 98% { opacity: 1; } 99% { opacity: 0.9; } }
      @keyframes menu-type    { from { width: 0; } }
      @keyframes menu-flash   { 50% { background: rgba(232, 160, 80, 0.16); } }
      @keyframes menu-roll    { to { transform: translateY(-100%); } }
      @media (prefers-reduced-motion: reduce) {
        .menu-title, .menu-cursor, .menu-type, .menu-row.is-flash { animation: none; }
        .menu-roll { animation: none; padding-top: 0; }
        .menu-roll-window { overflow-y: auto; }
      }

      /* ── Security camera monitor (CameraOverlay.js) ──────── */
      #cctv {
        position: fixed;
        inset: 0;
        display: none;
        /* Takes the clicks while the mouse is free for the map: one beside it
           would otherwise land on the canvas and lock the pointer again. */
        pointer-events: auto;
        cursor: default;
        z-index: 89;   /* under the HUD: the clock stays readable */
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #e8f0e8;
        text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        /* A dark edge: a monitor, not the player's own eyes. */
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
      }
      #cctv.is-on { display: block; }
      /* Scanlines that crawl slowly down the picture, and a faint band
         rolling through it, as on a real feed. Each moves by whole periods,
         so the loop has no seam. */
      #cctv::before,
      #cctv::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #cctv::before {
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.2) 0 1px, transparent 1px 3px);
        animation: cctv-crawl 0.9s linear infinite;
      }
      #cctv::after {
        background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.045) 45%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0.045) 55%, transparent 100%);
        background-size: 100% 40%;
        background-repeat: no-repeat;
        animation: cctv-roll 7s linear infinite;
      }
      @keyframes cctv-crawl { to { background-position: 0 3px; } }
      @keyframes cctv-roll { from { background-position: 0 -150%; } to { background-position: 0 250%; } }
      @media (prefers-reduced-motion: reduce) {
        #cctv::before, #cctv::after { animation: none; }
      }
      /* A switch waiting long on a camera that is loading. The switch
         itself is drawn on the GPU (CameraSignalPass). */
      #cctv-connecting {
        position: absolute;
        top: 42px;
        right: 22px;
        letter-spacing: 0.14em;
        color: #b8c8d8;
        display: none;
        animation: cctv-rec 1s steps(1) infinite;
      }
      #cctv.is-connecting #cctv-connecting { display: block; }
      #cctv-label {
        position: absolute;
        top: 18px;
        left: 22px;
        font-size: 15px;
        letter-spacing: 0.08em;
      }
      #cctv-label::after {
        content: "  ● REC";
        color: #ff3a2a;
        animation: cctv-rec 1s steps(1) infinite;
      }
      @keyframes cctv-rec { 50% { opacity: 0; } }
      #cctv-flash {
        position: absolute;
        top: 42px;
        left: 22px;
        color: #ffe9a0;
        letter-spacing: 0.08em;
        display: none;
      }
      #cctv.is-flash #cctv-flash { display: block; }
      #cctv-hint {
        position: absolute;
        bottom: 18px;
        left: 0;
        right: 0;
        text-align: center;
        color: #b8c8d8;
        font-size: 12px;
      }
      /* The map, bottom left: the base from above, a button per camera. */
      #cctv-map {
        position: absolute;
        left: 22px;
        bottom: 44px;
        /* A share of the monitor (the overlay is laid out at its size), so
           the map is the same on any window, in the corner of the picture. */
        width: 28%;
        background: rgba(6, 12, 10, 0.72);
        border: 1px solid rgba(160, 220, 180, 0.45);
        z-index: 1;
      }
      .cctv-room {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(190, 230, 200, 0.75);
        background: rgba(40, 70, 55, 0.55);
        color: rgba(220, 240, 225, 0.8);
        font-size: 9px;
        letter-spacing: 0.06em;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .cctv-room.is-outline {
        border: 1px dashed rgba(190, 230, 200, 0.45);
        background: transparent;
        align-items: flex-end;
        padding-bottom: 3px;
      }
      .cctv-cam {
        position: absolute;
        transform: translate(-50%, -50%);
        /* Its size is set inline (CameraOverlay CAMERA_SQUARE), so the push
           off its wall and the square agree. */
        box-sizing: border-box;
        padding: 0;
        font: bold 11px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #dfe9e2;
        background: #2a3530;
        border: 2px solid #9fb8a8;
        cursor: pointer;
        white-space: nowrap;
      }
      .cctv-cam:hover { background: #3c4b44; }
      .cctv-cam.is-active { background: #c9d94a; color: #111; border-color: #f2ff8a; }

      /* The monitor is the whole screen: no crosshair or [E] prompt over it. */
      body.cctv-on :is(#crosshair, #prompt, #tutorial) { visibility: hidden !important; }

      /* Gameplay overlays show only while playing. visibility, not display,
         so each owner's own display state survives the menu. */
      body:not([data-app="playing"]) :is(#hud, #crosshair, #prompt, #radar-overlay, #processing-screen, #signal-review, #cctv, #nap-hint, #event-banner, #tutorial):not(.on-screen) {
        visibility: hidden !important;
      }

      /* ── The intro (IntroPlayer.js builds its parts) ────────
         The story before the first shift: a canvas painted each frame,
         the beat's caption over it, and the end card. Over the menu, under
         the fade. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 160;
        background: #000;
        color: #d8e8f0;
        font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        /* Watched, not pointed at: a click anywhere skips or begins. */
        cursor: none;
        user-select: none;
      }
      #intro[hidden] { display: none; }
      #intro .intro-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #intro .intro-caption {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        width: min(760px, calc(100% - 32px));
        text-align: center;
        font-size: clamp(15px, 2.2vw, 22px);
        letter-spacing: 0.02em;
        text-shadow: 0 0 6px #000, 0 0 16px #000;
      }
      #intro .intro-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 16px;
        text-align: center;
      }
      #intro .intro-card[hidden] { display: none; }
      #intro .intro-array { color: #00dcc8; font-size: clamp(14px, 2.4vw, 20px); letter-spacing: 0.08em; }
      #intro .intro-begin { font-size: clamp(18px, 3.4vw, 30px); letter-spacing: 0.12em; animation: intro-blink 1.6s ease-in-out infinite; }
      #intro .intro-hint { color: #e8a050; min-height: 1.5em; }
      #intro .intro-skip {
        position: absolute;
        right: 16px;
        bottom: 12px;
        color: #8898a8;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      #intro .intro-skip[hidden] { display: none; }
      @keyframes intro-blink { 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) {
        #intro .intro-begin { animation: none; }
      }

      /* ── Screen fade (ScreenFade.js sets the duration) ──── */
      #fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.7s ease;
        /* Above the menu too: a fade covers the screen swap behind it. */
        z-index: 200;
      }
      #fade.is-dark { opacity: 1; }
      /* ScreenFade.caption: a line on the black while the next scene gets ready. */
      #fade .fade-caption {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8898a8;
        font: 14px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.4em;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #fade .fade-caption.is-shown { opacity: 1; }

      /* ── Bedroom PC (BedroomPCPanel.js, #114) ──────────────
         An old green-phosphor screen held up close: the colony map, the
         hub's findings, the forecast. It fills the view, the way the desk's
         terminal does (the Sleep Demon counts it as a screen). Below the
         menus (150), so a pause covers it; the night runs on behind it. */
      #bedroom-pc {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 140;
        background: rgba(2, 6, 4, 0.82);
        pointer-events: none;
      }
      #bedroom-pc.is-open { display: flex; }
      body:not([data-app="playing"]) #bedroom-pc:not(.on-screen) { visibility: hidden !important; }
      .pc-screen {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(560px, calc(100vw - 32px));
        max-height: calc(100vh - 48px);
        padding: 18px 22px 14px;
        background: #07130c;
        border: 2px solid #2f5a3e;
        border-radius: 10px;
        box-shadow: 0 0 0 6px #121a15, 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 0 60px rgba(60, 255, 140, 0.06);
        color: #8fe3a8;
        font: 13px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        text-shadow: 0 0 4px rgba(90, 255, 150, 0.35);
      }
      .pc-header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #23462f;
      }
      .pc-array { color: #c8ffd8; font-weight: bold; letter-spacing: 0.1em; }
      .pc-tabs { display: flex; gap: 10px; }
      .pc-tab { color: #4f8a62; letter-spacing: 0.08em; }
      .pc-tab.is-active { color: #07130c; background: #8fe3a8; padding: 0 5px; text-shadow: none; }
      .pc-body { min-height: 240px; overflow-y: auto; }
      .pc-map { display: block; width: min(320px, 100%); margin: 0 auto; overflow: visible; }
      .pc-map text { font: 7px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: #8fe3a8; }
      .pc-ring { fill: none; stroke: #23462f; stroke-dasharray: 2 3; }
      .pc-route { fill: none; stroke: #c8ffd8; stroke-width: 1.2; }
      .pc-hub-line { stroke: #e0c25a; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .pc-hub-head { fill: #e0c25a; }
      .pc-map .pc-hub-label { fill: #e0c25a; }
      .pc-neighbour { fill: #07130c; stroke: #8fe3a8; stroke-width: 1.2; }
      .pc-map .pc-neighbour-label { fill: #4f8a62; }
      .pc-base { fill: #c8ffd8; }
      .pc-map .pc-base-label { fill: #c8ffd8; font-weight: bold; }
      .pc-note { margin: 8px 0 0; color: #4f8a62; font-size: 11px; }
      .pc-findings { margin: 0; padding-left: 22px; }
      .pc-finding { margin-bottom: 8px; }
      .pc-finding-title { color: #c8ffd8; }
      .pc-finding-body { color: #6fb886; }
      .pc-empty { margin: 0; color: #c8ffd8; letter-spacing: 0.06em; }
      .pc-hint {
        padding-top: 8px;
        border-top: 1px solid #23462f;
        color: #4f8a62;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* ── Generator breaker panel (BreakerPanel.js) ──────── */
      #breaker-panel {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(6, 8, 12, 0.78);
        z-index: 97;
        font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
        user-select: none;
      }
      #breaker-panel.is-open { display: flex; }
      .breaker-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 22px 28px;
        background: #1c2026;
        border: 2px solid #3a414a;
        border-radius: 6px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6), inset 0 0 0 4px #15181d;
      }
      .breaker-title {
        color: #ffb347;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: bold;
      }
      .breaker-switches { display: flex; gap: 14px; }
      .breaker-switch {
        width: 34px;
        height: 64px;
        padding: 0;
        position: relative;
        background: #0e1013;
        border: 2px solid #4a525c;
        border-radius: 4px;
        cursor: pointer;
      }
      .breaker-lever {
        position: absolute;
        left: 4px;
        right: 4px;
        height: 26px;
        bottom: 4px;
        background: #8a3a3a;
        border-radius: 3px;
        transition: bottom 0.08s, background 0.08s;
      }
      .breaker-switch.is-on .breaker-lever { bottom: 30px; background: #4fbf74; }
      .breaker-wires { background: #121418; border-radius: 4px; touch-action: none; }
      .breaker-lead { cursor: grab; }
      .breaker-lead.is-held { stroke: #fff; stroke-width: 3; }
      .breaker-terminal { cursor: pointer; }
      .breaker-terminal.is-spark { stroke: #fff !important; filter: drop-shadow(0 0 6px #fff); }
      .breaker-drag, .breaker-links { pointer-events: none; }
      .breaker-status { color: #e8a050; letter-spacing: 0.08em; text-transform: uppercase; }
      .breaker-status.is-solved { color: #6ecf9a; }
      .breaker-hint { font-size: 11px; color: #667; letter-spacing: 0.06em; }

      /* ── White-out when the UFO takes you (WhiteOut.js) ──── */
      #whiteout {
        position: fixed;
        inset: 0;
        background: #fffdf8;
        opacity: 0;
        pointer-events: none;
        transition: opacity 2.5s ease-in;
        z-index: 102;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #whiteout.is-white { opacity: 1; }
      /* Eaten by a dust eye: red rather than the UFO's white. */
      #whiteout.is-blood { background: #6e0606; }
      #whiteout.is-blood .whiteout-message { color: #f3c4b8; }
      .whiteout-message {
        font-family: 'Courier New', monospace;
        font-size: 20px;
        letter-spacing: 0.08em;
        color: #3a3632;
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      .whiteout-message.is-shown { opacity: 1; }

      /* Evil signal DELETE warning — flashing red text at random positions. */
#delete-warning {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 101;
        overflow: hidden;
        opacity: 0;
        transition: opacity 5s ease-in;
      }
#delete-warning.is-active { opacity: 1; }
      .delete-text {
        position: absolute;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        color: #ff1111;
        text-shadow: 0 0 8px #ff0000, 0 0 20px #cc0000;
        opacity: 0;
        white-space: nowrap;
        user-select: none;
        transition: none;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>

    <!-- HUD (hidden until gameplay starts) -->
    <div id="nap-hint"></div>
    <div id="tutorial" aria-live="polite"></div>
    <div id="hud">
      <div id="hud-clock">12:00 AM</div>
      <div id="hud-signals">Signals: 0 / 3</div>
      <div id="hud-night">Night 1</div>
      <div id="hud-scan-bar"></div>
      <div id="hud-prompt"></div>
      <div id="hud-suit">EVA suit on</div>
      <div id="hud-stamina" data-level="ok"><span>Stamina</span><div id="hud-stamina-track"><div id="hud-stamina-fill"></div></div></div>
    </div>

    <!-- Event banner (EventBanner.js) — centred, upper third -->
    <div id="event-banner"><span id="event-banner-text"></span></div>

    <!-- The eyelids, and a tired player's tunnel vignette (FatigueOverlay.js) -->
    <div id="fatigue">
      <div id="fatigue-tunnel"></div>
      <div id="fatigue-lids"></div>
      <div id="bed-darkness"></div>
    </div>

    <!-- Radar overlay (shown while using the computer) -->
    <div id="radar-overlay">
      <div id="radar-telemetry"></div>
      <canvas id="radar-canvas"></canvas>
      <div id="radar-warning"></div>
      <div id="radar-info"></div>
      <div id="radar-hint">Select a signal blip, then aim with WASD</div>
    </div>

    <!-- Security camera monitor (shown while using the camera terminal) -->
    <div id="cctv">
      <div id="cctv-connecting">CONNECTING…</div>
      <div id="cctv-label"></div>
      <div id="cctv-flash">FLASH ON</div>
      <div id="cctv-hint"></div>
      <div id="cctv-map"></div>
    </div>

    <!-- Processing screen (ServerRoom console overlay) -->
    <div id="processing-screen">
      <div id="processing-title">Signal Processing</div>
      <div id="processing-preview">
        <canvas id="processing-spectrogram" width="480" height="360"></canvas>
        <div id="processing-scanline" data-paint-live></div>
      </div>
      <div id="tuning-game">
        <canvas id="tuning-canvas" width="480" height="60"></canvas>
        <input type="range" id="tuning-slider" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div id="processing-viz">
        <div class="viz-slider">
          <label for="viz-gain">Gain</label>
          <input type="range" id="viz-gain" min="0.5" max="5" step="0.1" value="1">
        </div>
        <div class="viz-slider">
          <label for="viz-contrast">Contrast</label>
          <input type="range" id="viz-contrast" min="0.2" max="3" step="0.1" value="1">
        </div>
        <div class="viz-slider">
          <label for="viz-volume">Volume</label>
          <input type="range" id="viz-volume" min="0" max="1" step="0.05" value="0.7">
        </div>
      </div>
      <audio id="processing-audio" preload="auto"></audio>
      <div id="processing-media"></div>
      <div id="processing-controls"></div>
      <div id="processing-progress">
        <div id="processing-progress-bar">
          <div id="processing-progress-fill"></div>
        </div>
        <div id="processing-progress-label">Processing… 0%</div>
      </div>
      <div id="processing-hint">Q: close</div>
    </div>

    <!-- Menus: main, pause, settings, controls, credits, end screens -->
    <div id="menu" role="dialog" aria-label="Menu">
      <div id="menu-status" aria-hidden="true"></div>
      <div id="menu-panel"></div>
    </div>

    <!-- The intro before the first shift (IntroPlayer.js fills it) -->
    <div id="intro" hidden></div>

    <div id="fade"></div>

    <!-- Generator breaker panel (built per puzzle by BreakerPanel.js) -->
    <div id="breaker-panel"></div>

    <!-- The bedroom PC's screens (BedroomPCPanel.js) -->
    <div id="bedroom-pc"></div>

    <div id="whiteout"><div class="whiteout-message"></div></div>
    
        <!-- Evil signal DELETE warning (flashing red text) -->
    <div id="delete-warning"></div>

    <div id="loading">
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-label">Loading…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
