<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Air</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }

      /* ── Crosshair ─────────────────────────────────────── */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
        display: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 1px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        transition: background 0.15s, transform 0.15s;
      }
      /* vertical bar */
      #crosshair::before {
        width: 2px;
        height: 14px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* horizontal bar */
      #crosshair::after {
        width: 14px;
        height: 2px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* Active state: brighter + slightly larger when targeting an interactable */
      #crosshair.active::before,
      #crosshair.active::after {
        background: #00e5ff;
        box-shadow: 0 0 4px #00e5ff;
      }
      #crosshair.active::before { height: 18px; }
      #crosshair.active::after  { width:  18px; }
      /* Inlined so the panel paints before any script has parsed. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0d0d14;
        color: #b8b8c8;
        font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      #loading.is-hidden { opacity: 0; pointer-events: none; }
      #loading-track {
        width: min(320px, 60vw);
        height: 2px;
        background: #23232e;
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #6ecf9a;
        transition: width 0.2s ease;
      }
      #loading.is-error #loading-bar { background: #cf6e6e; }
      #loading.is-error #loading-label {
        color: #cf8a8a;
        max-width: 60vw;
        text-align: center;
        text-transform: none;
        letter-spacing: 0;
      }

      /* ── HUD ────────────────────────────────────────────── */
      #hud {
        position: fixed;
        top: 16px;
        right: 20px;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        pointer-events: none;
        z-index: 90;
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      }
      #hud-clock {
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 0.06em;
        color: #d8e8f0;
      }
      #hud-signals {
        color: #6ecf9a;
        letter-spacing: 0.04em;
      }
      #hud-night {
        color: #8898a8;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #hud-scan-bar {
        display: none;
        width: 160px;
        height: 4px;
        background: #00e5ff;
        border-radius: 2px;
        margin-top: 6px;
        transition: width 0.15s ease;
      }
      #hud-prompt {
        margin-top: 8px;
        font-size: 11px;
        color: #8898a8;
      }

      /* ── Radar overlay ─────────────────────────────────── */
      #radar-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        background: rgba(8, 10, 18, 0.82);
        z-index: 95;
        font: 12px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: #b8c8d8;
      }
      #radar-canvas {
        border-radius: 50%;
        box-shadow: 0 0 30px rgba(0, 200, 180, 0.15);
      }
      #radar-info {
        min-height: 1.4em;
        text-align: center;
        color: #00dcc8;
      }
      #radar-hint {
        font-size: 11px;
        color: #556;
        letter-spacing: 0.06em;
      }

      /* ── Signal review panel ───────────────────────────── */
      #signal-review {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: rgba(6, 8, 14, 0.92);
        z-index: 96;
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      }
      #signal-review-image {
        max-width: 480px;
        max-height: 360px;
        border: 2px solid rgba(0, 200, 180, 0.4);
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(0, 200, 180, 0.15);
      }
      #signal-review-actions {
        display: flex;
        gap: 32px;
      }
      #signal-save-btn,
      #signal-delete-btn {
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 3px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: background 0.15s;
      }
      #signal-save-btn {
        color: #6ecf9a;
        border: 1px solid rgba(110, 207, 154, 0.4);
      }
      #signal-save-btn:hover {
        background: rgba(110, 207, 154, 0.15);
      }
      #signal-delete-btn {
        color: #cf6e6e;
        border: 1px solid rgba(207, 110, 110, 0.4);
      }
      #signal-delete-btn:hover {
        background: rgba(207, 110, 110, 0.15);
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>

    <!-- HUD (hidden until gameplay starts) -->
    <div id="hud">
      <div id="hud-clock">12:00 AM</div>
      <div id="hud-signals">Signals: 0 / 3</div>
      <div id="hud-night">Night 1</div>
      <div id="hud-scan-bar"></div>
      <div id="hud-prompt"></div>
    </div>

    <!-- Radar overlay (shown while using the computer) -->
    <div id="radar-overlay">
      <canvas id="radar-canvas" width="400" height="400"></canvas>
      <div id="radar-info"></div>
      <div id="radar-hint">Select a signal blip, then aim with WASD</div>
    </div>

    <!-- Signal review modal (save/delete after scanning) -->
    <div id="signal-review">
      <img id="signal-review-image" alt="Signal payload" />
      <div id="signal-review-actions">
        <span id="signal-save-btn">[S] Save Signal</span>
        <span id="signal-delete-btn">[D] Delete Signal</span>
      </div>
    </div>

    <div id="loading">
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-label">Loading…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
