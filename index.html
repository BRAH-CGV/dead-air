<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Air</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        width: 4px; height: 4px;
        background: rgba(255,255,255,0.7);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; z-index: 10;
        display: none;
      }
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.6);
        color: #fff; font-family: sans-serif; font-size: 1.4em;
        cursor: pointer; z-index: 20;
      }
      #overlay.hidden { display: none; }
      #interaction-prompt {
        position: fixed; bottom: 25%; left: 50%;
        transform: translateX(-50%);
        color: #fff; font-family: sans-serif; font-size: 1.1em;
        background: rgba(0,0,0,0.5); padding: 8px 18px;
        border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);
        pointer-events: none; z-index: 10;
        display: none; text-align: center;
      }
      #objective-tracker {
        position: fixed; top: 16px; left: 16px;
        color: #ddd; font-family: monospace; font-size: 0.85em;
        background: rgba(0,0,0,0.4); padding: 10px 14px;
        border-radius: 6px; pointer-events: none; z-index: 10;
        display: none; min-width: 200px;
      }
      #objective-tracker .obj-title {
        color: #88aaff; margin-bottom: 6px; font-weight: bold;
      }
      #objective-tracker .obj-item { margin: 3px 0; }
      #objective-tracker .obj-item.done { color: #55aa55; text-decoration: line-through; }
      #game-message {
        position: fixed; top: 35%; left: 50%;
        transform: translateX(-50%);
        color: #ffcc44; font-family: sans-serif; font-size: 1.3em;
        font-weight: bold; pointer-events: none; z-index: 10;
        display: none; text-shadow: 0 0 10px rgba(255,200,0,0.5);
      }
      #win-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: none; align-items: center; justify-content: center;
        flex-direction: column;
        background: rgba(0,0,0,0.8);
        color: #55ff55; font-family: sans-serif; z-index: 30;
      }
      #win-screen h1 { font-size: 2.5em; margin-bottom: 0.2em; }
      #win-screen p { font-size: 1.2em; color: #aaa; }
      #win-screen button {
        margin-top: 1.5em; padding: 10px 30px;
        font-size: 1em; cursor: pointer;
        background: #335; color: #fff; border: 1px solid #558;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="overlay">Click to play<br><small>WASD to move · Mouse to look · E to interact · V to toggle camera</small></div>
    <div id="interaction-prompt"></div>
    <div id="objective-tracker">
      <div class="obj-title">OBJECTIVES</div>
      <div id="obj-list"></div>
    </div>
    <div id="game-message"></div>
    <div id="win-screen">
      <h1>SIGNAL SENT</h1>
      <p>Level 1 Complete</p>
      <button id="restart-btn">Restart Level</button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
