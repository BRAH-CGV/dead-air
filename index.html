<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dead Air</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      canvas { display: block; }

      /* ── Crosshair ─────────────────────────────────────── */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 100;
        display: none;
      }
      #crosshair::before,
      #crosshair::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 1px;
        box-shadow: 0 0 2px rgba(0, 0, 0, 0.9);
        transition: background 0.15s, transform 0.15s;
      }
      /* vertical bar */
      #crosshair::before {
        width: 2px;
        height: 14px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* horizontal bar */
      #crosshair::after {
        width: 14px;
        height: 2px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      /* Active state: brighter + slightly larger when targeting an interactable */
      #crosshair.active::before,
      #crosshair.active::after {
        background: #00e5ff;
        box-shadow: 0 0 4px #00e5ff;
      }
      #crosshair.active::before { height: 18px; }
      #crosshair.active::after  { width:  18px; }
      /* Inlined so the panel paints before any script has parsed. */
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0d0d14;
        color: #b8b8c8;
        font: 14px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 0.4s ease;
        z-index: 10;
      }
      #loading.is-hidden { opacity: 0; pointer-events: none; }
      #loading-track {
        width: min(320px, 60vw);
        height: 2px;
        background: #23232e;
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #6ecf9a;
        transition: width 0.2s ease;
      }
      #loading.is-error #loading-bar { background: #cf6e6e; }
      #loading.is-error #loading-label {
        color: #cf8a8a;
        max-width: 60vw;
        text-align: center;
        text-transform: none;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="loading">
      <div id="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-label">Loading…</div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
